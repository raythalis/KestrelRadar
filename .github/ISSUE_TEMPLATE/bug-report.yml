name: Bug report
description: Report a reproducible problem in Kestrel Radar
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, search existing issues if possible. Remove or redact secrets, cookies, tokens, private URLs, and personal data from logs and screenshots.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly.
      placeholder: A short description of the issue
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps that reproduce the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kestrel Radar version
      description: Find the version in Settings.
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Docker Compose
        - One-click script
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact secrets and private information before sharing.
      render: text
    validations:
      required: false

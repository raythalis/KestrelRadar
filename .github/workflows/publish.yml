name: Publish Docker image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Published image version to mirror from GHCR (for backfills)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify release source
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test:unit
      - run: pnpm build

  publish:
    name: Build and publish GHCR and Docker Hub
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: raythalis
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/raythalis/kestrelradar
            raythalis/kestrelradar
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  mirror:
    name: Mirror existing GHCR image to Docker Hub
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: raythalis
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install crane
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz \
            --output crane.tar.gz
          tar -xzf crane.tar.gz crane
          sudo install -m 0755 crane /usr/local/bin/crane
      - name: Copy pinned image and verify digest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          source="ghcr.io/raythalis/kestrelradar:$VERSION"
          dest="raythalis/kestrelradar:$VERSION"
          source_digest=$(crane digest "$source")
          crane copy "$source" "$dest"
          test "$(crane digest "$dest")" = "$source_digest"
          if [ "$(crane digest ghcr.io/raythalis/kestrelradar:latest)" = "$source_digest" ]; then
            crane copy "$source" raythalis/kestrelradar:latest
            test "$(crane digest raythalis/kestrelradar:latest)" = "$source_digest"
          fi
